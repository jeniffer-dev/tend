document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

#212630; padding: 48px 40px 20px; display: flex; flex-direction: column; gap: 28px\">\n  <div style=\"display: flex; flex-direction: column; gap: 8px\">\n    <p style=\"margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Tend · Round 2 · <a href=\"#2a\">2a<\u002Fa><\u002Fp>\n    <h1 style=\"margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em\">Reminder, Not now, Set a reminder, Review extended<\u002Fh1>\n    <p style=\"margin: 0; font-size: 14px; color: #757C8A; max-width: 620px; text-wrap: pretty\">A task can ring at a time you set. Postponing it is never blocked — it asks you to write why, and keeps what you wrote. Eight frames at 390px, including how a postponed task reads back on Home and Week.<\u002Fp>\n  <\u002Fdiv>\n\n  <div id=\"2a\" style=\"display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start\">\n\n    <!-- REMINDER -->\n    <div style=\"display: flex; flex-direction: column; gap: 10px\">\n      <div style=\"display: flex; align-items: baseline; gap: 10px\">\n        <span style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Reminder<\u002Fspan>\n        <span style=\"font-size: 12px; color: rgba(117,124,138,0.6)\">What is asking for me right now?<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"width: 390px; height: 844px; background: #F9F9F6; border: 1px solid #E8E6E3; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column\">\n        <div style=\"flex: 1; overflow: hidden; padding: 28px 20px 8px; display: flex; flex-direction: column; justify-content: center; gap: 28px\">\n          <div style=\"display: flex; flex-direction: column; gap: 14px\">\n            <div style=\"display: flex; align-items: center; gap: 8px\">\n              <span style=\"width: 8px; height: 8px; border-radius: 999px; background: #FCD581\"><\u002Fspan>\n              <span style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Morning pages · 7:15<\u002Fspan>\n            <\u002Fdiv>\n            <h2 style=\"margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.15; text-wrap: pretty\">Write before you open anything else.<\u002Fh2>\n          <\u002Fdiv>\n\n          <div style=\"background: #FDFDFC; border: 1px solid #E8E6E3; border-radius: 12px; box-shadow: 0 1px 2px rgba(33,38,48,0.04); padding: 18px 20px; display: flex; flex-direction: column; gap: 12px\">\n            <p style=\"margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">This week<\u002Fp>\n            <div style=\"height: 2px; border-radius: 999px; background: #F1F0EE; overflow: hidden\">\n              <div style=\"width: 66%; height: 100%; background: #FCD581\"><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin: 0; font-size: 14px; color: #757C8A; text-wrap: pretty\">Two of the three sessions you set for Morning pages. Last one Thursday.<\u002Fp>\n          <\u002Fdiv>\n\n          <p style=\"margin: 0; font-size: 14px; line-height: 1.5; color: #757C8A; text-wrap: pretty\">Fifteen minutes. If now is wrong, say what is in the way and pick when it comes back.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 10px; background: linear-gradient(to top, #F9F9F6 60%, rgba(249,249,246,0))\">\n          <div style=\"display: flex; gap: 8px\">\n            <button type=\"button\" style=\"flex: 1; height: 52px; border: 1px solid #212630; border-radius: 8px; background: transparent; color: #212630; font-family: inherit; font-size: 16px; font-weight: 500; cursor: pointer; transition: background-color 150ms\" style-hover=\"background: #F1F0EE\">Not now<\u002Fbutton>\n            <button type=\"button\" style=\"flex: 1; height: 52px; border: 1px solid #212630; border-radius: 8px; background: transparent; color: #212630; font-family: inherit; font-size: 16px; font-weight: 500; cursor: pointer; transition: background-color 150ms\" style-hover=\"background: #F1F0EE\">Tend now<\u002Fbutton>\n          <\u002Fdiv>\n          <button type=\"button\" style=\"height: 44px; border: none; border-radius: 8px; background: transparent; color: #757C8A; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms, color 150ms\" style-hover=\"background: #F1F0EE; color: #212630\">I already wrote today — mark it done<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- NOT NOW · FIRST TIME -->\n    <div style=\"display: flex; flex-direction: column; gap: 10px\">\n      <div style=\"display: flex; align-items: baseline; gap: 10px\">\n        <span style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Not now · first time<\u002Fspan>\n        <span style=\"font-size: 12px; color: rgba(117,124,138,0.6)\">What is in the way?<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"width: 390px; height: 844px; background: #F9F9F6; border: 1px solid #E8E6E3; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column\">\n        <div style=\"flex: 1; overflow: hidden; padding: 28px 20px 8px; display: flex; flex-direction: column; gap: 24px\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <div style=\"display: flex; align-items: center; gap: 8px\">\n              <span style=\"width: 8px; height: 8px; border-radius: 999px; background: #FCD581\"><\u002Fspan>\n              <span style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Not now · Morning pages<\u002Fspan>\n            <\u002Fdiv>\n            <h2 style=\"margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; text-wrap: pretty\">Write before you open anything else.<\u002Fh2>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-direction: column; gap: 8px\">\n            <label style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Why not now<\u002Flabel>\n            <textarea rows=\"4\" placeholder=\"Anything true is enough\" style=\"width: 100%; box-sizing: border-box; min-height: 96px; resize: none; border: 1px solid #E8E6E3; border-radius: 8px; background: #FDFDFC; padding: 12px; font-size: 16px; line-height: 1.5; color: #212630; outline: none; transition: border-color 150ms\" style-focus=\"border-color: #64B493\"><\u002Ftextarea>\n            <p style=\"margin: 0; font-size: 12px; color: rgba(117,124,138,0.5); text-wrap: pretty\">The reason stays with the task. You will read it the next time this rings, and it appears in your week in review.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-direction: column; gap: 10px\">\n            <p style=\"margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Comes back<\u002Fp>\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 8px\">\n              <button type=\"button\" style=\"height: 44px; border: 1px solid #212630; border-radius: 8px; background: #212630; color: #F9F9F6; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms\">Later today<\u002Fbutton>\n              <button type=\"button\" style=\"height: 44px; border: 1px solid #E8E6E3; border-radius: 8px; background: #FDFDFC; color: #212630; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms, border-color 150ms\" style-hover=\"border-color: #212630\">Tomorrow, 7:15<\u002Fbutton>\n              <button type=\"button\" style=\"height: 44px; border: 1px solid #E8E6E3; border-radius: 8px; background: #FDFDFC; color: #212630; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms, border-color 150ms\" style-hover=\"border-color: #212630\">Pick a day<\u002Fbutton>\n              <button type=\"button\" style=\"height: 44px; border: 1px solid #E8E6E3; border-radius: 8px; background: #FDFDFC; color: #212630; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms, border-color 150ms\" style-hover=\"border-color: #212630\">No time<\u002Fbutton>\n            <\u002Fdiv>\n            <p style=\"margin: 0; font-size: 12px; color: rgba(117,124,138,0.5); text-wrap: pretty\">No time means it stops ringing and waits on the list until you next tend Morning pages.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 8px; background: linear-gradient(to top, #F9F9F6 60%, rgba(249,249,246,0))\">\n          <button type=\"button\" style=\"height: 44px; border: 1px solid #E8E6E3; border-radius: 8px; background: transparent; color: #212630; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms\" style-hover=\"background: #F1F0EE\">Postpone it<\u002Fbutton>\n          <p style=\"margin: 0; text-align: center; font-size: 12px; color: rgba(117,124,138,0.5)\">Write a reason first. Nothing else is required.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- NOT NOW · FOURTH TIME -->\n    <div style=\"display: flex; flex-direction: column; gap: 10px\">\n      <div style=\"display: flex; align-items: baseline; gap: 10px\">\n        <span style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Not now · fourth time<\u002Fspan>\n        <span style=\"font-size: 12px; color: rgba(117,124,138,0.6)\">What has been in the way before?<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"width: 390px; height: 844px; background: #F9F9F6; border: 1px solid #E8E6E3; border-radius: 20px; overflow-y: auto; display: flex; flex-direction: column\">\n        <div style=\"flex: 1; padding: 28px 20px 8px; display: flex; flex-direction: column; gap: 24px\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <div style=\"display: flex; align-items: center; gap: 8px\">\n              <span style=\"width: 8px; height: 8px; border-radius: 999px; background: #64B493\"><\u002Fspan>\n              <span style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Not now · Health<\u002Fspan>\n            <\u002Fdiv>\n            <h2 style=\"margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; text-wrap: pretty\">Book the blood test<\u002Fh2>\n            <p style=\"margin: 0; font-size: 14px; color: #757C8A; text-wrap: pretty\">Postponed three times this month. Here is what you wrote.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-direction: column; gap: 8px\">\n            <div style=\"background: #FDFDFC; border: 1px solid #E8E6E3; border-radius: 12px; box-shadow: 0 1px 2px rgba(33,38,48,0.04); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px\">\n              <span style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Tue 8<\u002Fspan>\n              <span style=\"font-size: 14px; line-height: 1.5; color: #212630; text-wrap: pretty\">The clinic is closed by the time I remember.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background: #FDFDFC; border: 1px solid #E8E6E3; border-radius: 12px; box-shadow: 0 1px 2px rgba(33,38,48,0.04); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px\">\n              <span style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Thu 10<\u002Fspan>\n              <span style=\"font-size: 14px; line-height: 1.5; color: #212630; text-wrap: pretty\">Still need the referral number and it is not in my email.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background: #FDFDFC; border: 1px solid #E8E6E3; border-radius: 12px; box-shadow: 0 1px 2px rgba(33,38,48,0.04); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px\">\n              <span style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Fri 12<\u002Fspan>\n              <span style=\"font-size: 14px; line-height: 1.5; color: #212630; text-wrap: pretty\">Rang while I was driving.<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin: 0; font-size: 12px; color: rgba(117,124,138,0.5); text-wrap: pretty\">Twice it was the phone call itself. A fifteen-minute session with the clinic open might be the thing this needs, rather than another morning.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-direction: column; gap: 8px\">\n            <label style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Why not now<\u002Flabel>\n            <textarea rows=\"3\" placeholder=\"Anything true is enough\" style=\"width: 100%; box-sizing: border-box; min-height: 78px; resize: none; border: 1px solid #E8E6E3; border-radius: 8px; background: #FDFDFC; padding: 12px; font-size: 16px; line-height: 1.5; color: #212630; outline: none; transition: border-color 150ms\" style-focus=\"border-color: #64B493\"><\u002Ftextarea>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-direction: column; gap: 10px\">\n            <p style=\"margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Comes back<\u002Fp>\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 8px\">\n              <button type=\"button\" style=\"height: 44px; border: 1px solid #212630; border-radius: 8px; background: #212630; color: #F9F9F6; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms\">Today, 14:00<\u002Fbutton>\n              <button type=\"button\" style=\"height: 44px; border: 1px solid #E8E6E3; border-radius: 8px; background: #FDFDFC; color: #212630; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms, border-color 150ms\" style-hover=\"border-color: #212630\">Tomorrow, 9:00<\u002Fbutton>\n              <button type=\"button\" style=\"height: 44px; border: 1px solid #E8E6E3; border-radius: 8px; background: #FDFDFC; color: #212630; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms, border-color 150ms\" style-hover=\"border-color: #212630\">Pick a day<\u002Fbutton>\n              <button type=\"button\" style=\"height: 44px; border: 1px solid #E8E6E3; border-radius: 8px; background: #FDFDFC; color: #212630; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms, border-color 150ms\" style-hover=\"border-color: #212630\">No time<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding: 24px 20px; display: flex; flex-direction: column; gap: 4px; background: linear-gradient(to top, #F9F9F6 60%, rgba(249,249,246,0))\">\n          <button type=\"button\" style=\"height: 44px; border: none; border-radius: 8px; background: #64B493; color: #FDFDFC; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms\" style-hover=\"background: #55A283\">Postpone it<\u002Fbutton>\n          <button type=\"button\" style=\"height: 44px; border: none; border-radius: 8px; background: transparent; color: #757C8A; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms, color 150ms\" style-hover=\"background: #F1F0EE; color: #212630\">Take it off the week list<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- SET A REMINDER -->\n    <div style=\"display: flex; flex-direction: column; gap: 10px\">\n      <div style=\"display: flex; align-items: baseline; gap: 10px\">\n        <span style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Set a reminder<\u002Fspan>\n        <span style=\"font-size: 12px; color: rgba(117,124,138,0.6)\">When should this ring?<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"width: 390px; height: 844px; background: #F9F9F6; border: 1px solid #E8E6E3; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end\">\n        <div style=\"flex: 1; padding: 28px 20px 0; display: flex; flex-direction: column; gap: 20px; opacity: 0.4\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <p style=\"margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Health · this week<\u002Fp>\n            <h2 style=\"margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em\">Pick one thing<\u002Fh2>\n          <\u002Fdiv>\n          <div style=\"background: #FDFDFC; border: 1px solid #212630; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px\">\n            <span style=\"font-size: 16px; font-weight: 600; letter-spacing: -0.01em\">Book the blood test<\u002Fspan>\n            <span style=\"font-size: 14px; color: #757C8A\">Found the lab. Need the referral number.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"background: #FDFDFC; border: 1px solid #E8E6E3; border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 8px\">\n            <span style=\"font-size: 16px; font-weight: 600; letter-spacing: -0.01em\">Refill the prescription<\u002Fspan>\n            <span style=\"font-size: 14px; color: #757C8A\">Not attended yet.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background: #FDFDFC; border-top: 1px solid #E8E6E3; border-radius: 20px 20px 0 0; box-shadow: 0 -1px 2px rgba(33,38,48,0.04); padding: 24px 20px; display: flex; flex-direction: column; gap: 22px\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <p style=\"margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Reminder<\u002Fp>\n            <h3 style=\"margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; text-wrap: pretty\">Book the blood test<\u002Fh3>\n            <p style=\"margin: 0; font-size: 14px; line-height: 1.5; color: #757C8A; text-wrap: pretty\">The reminder belongs to this task, not to one session. It rings until the task is done, whichever session you tend it in.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-direction: column; gap: 10px\">\n            <p style=\"margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Time<\u002Fp>\n            <div style=\"display: flex; align-items: center; gap: 12px\">\n              <span style=\"font-size: 40px; font-weight: 500; letter-spacing: -0.03em; font-variant-numeric: tabular-nums\">9:00<\u002Fspan>\n              <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                <button type=\"button\" aria-label=\"Later\" style=\"width: 44px; height: 44px; border: 1px solid #E8E6E3; border-radius: 8px; background: transparent; color: #212630; font-family: inherit; font-size: 16px; cursor: pointer; transition: background-color 150ms\" style-hover=\"background: #F1F0EE\">+<\u002Fbutton>\n                <button type=\"button\" aria-label=\"Earlier\" style=\"width: 44px; height: 44px; border: 1px solid # px\">\n                <div style=\"display: flex; align-items: center; gap: 8px\">\n                  <span style=\"width: 8px; height: 8px; border-radius: 999px; background: #64B493\"><\u002Fspan>\n                  <span style=\"font-size: 16px; font-weight: 600; letter-spacing: -0.01em\">Health<\u002Fspan>\n                <\u002Fdiv>\n                <p style=\"margin: 0; font-size: 14px; color: #757C8A\">Two sessions this week. Last attended Monday.<\u002Fp>\n                <p style=\"margin: 0; padding-left: 10px; border-left: 1px solid #E8E6E3; font-size: 13px; line-height: 1.45; color: #757C8A; text-wrap: pretty\">Book the blood test, postponed three times. Last reason: rang while I was driving.<\u002Fp>\n              <\u002Fdiv>\n              <button type=\"button\" style=\"height: 44px; border: none; border-radius: 8px; background: #64B493; color: #FDFDFC; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms\" style-hover=\"background: #55A283\">Tend<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"background: #FDFDFC; border: 1px solid #E8E6E3; border-radius: 12px; box-shadow: 0 1px 2px rgba(33,38,48,0.04); padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n              <div style=\"display: flex; flex-direction: column; gap: 6px\">\n                <div style=\"display: flex; align-items: center; gap: 8px\">\n                  <span style=\"width: 8px; height: 8px; border-radius: 999px; background: #FCD581\"><\u002Fspan>\n                  <span style=\"font-size: 16px; font-weight: 600; letter-spacing: -0.01em\">Morning pages<\u002Fspan>\n                <\u002Fdiv>\n                <p style=\"margin: 0; font-size: 14px; color: #757C8A\">Last attended Thursday.<\u002Fp>\n              <\u002Fdiv>\n              <button type=\"button\" style=\"height: 44px; border: none; border-radius: 8px; background: #64B493; color: #FDFDFC; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms\" style-hover=\"background: #55A283\">Tend<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"background: #FDFDFC; border: 1px solid #E8E6E3; border-radius: 12px; box-shadow: 0 1px 2px rgba(33,38,48,0.04); padding: 0 16px; min-height: 44px; opacity: 0.55; display: flex; align-items: center; gap: 8px\">\n              <span style=\"width: 8px; height: 8px; border-radius: 999px; background: #ADEEE3\"><\u002Fspan>\n              <span style=\"font-size: 16px; font-weight: 600; letter-spacing: -0.01em\">Home<\u002Fspan>\n              <span style=\"font-size: 14px; color: #757C8A\">Attended today, 15 minutes<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <p style=\"margin: 0; font-size: 12px; color: rgba(117,124,138,0.5); text-wrap: pretty\">People sits outside today. It stays on the week list until you put it here.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"padding: 20px; display: flex; gap: 4px; background: linear-gradient(to top, #F9F9F6 60%, rgba(249,249,246,0))\">\n          <button type=\"button\" style=\"flex: 1; height: 44px; border: none; border-radius: 8px; background: transparent; color: #757C8A; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms, color 150ms\" style-hover=\"background: #F1F0EE; color: #212630\">Capture<\u002Fbutton>\n          <button type=\"button\" style=\"flex: 1; height: 44px; border: none; border-radius: 8px; background: transparent; color: #757C8A; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms, color 150ms\" style-hover=\"background: #F1F0EE; color: #212630\">Inbox<\u002Fbutton>\n          <button type=\"button\" style=\"flex: 1; height: 44px; border: none; border-radius: 8px; background: transparent; color: #757C8A; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms, color 150ms\" style-hover=\"background: #F1F0EE; color: #212630\">Week<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- WEEK · POSTPONED TASK -->\n    <div style=\"display: flex; flex-direction: column; gap: 10px\">\n      <div style=\"display: flex; align-items: baseline; gap: 10px\">\n        <span style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Week · postponed<\u002Fspan>\n        <span style=\"font-size: 12px; color: rgba(117,124,138,0.6)\">What am I committing to?<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"width: 390px; height: 844px; background: #F9F9F6; border: 1px solid #E8E6E3; border-radius: 20px; overflow-y: auto; display: flex; flex-direction: column\">\n        <div style=\"flex: 1; padding: 28px 20px 8px; display: flex; flex-direction: column; gap: 20px\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <p style=\"margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">This week<\u002Fp>\n            <h2 style=\"margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em\">Four areas, ten sessions<\u002Fh2>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 12px\">\n            <div style=\"background: #FDFDFC; border: 1px solid #E8E6E3; border-radius: 12px; box-shadow: 0 1px 2px rgba(33,38,48,0.04); padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n              <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px\">\n                <div style=\"display: flex; align-items: center; gap: 8px\">\n                  <span style=\"width: 8px; height: 8px; border-radius: 999px; background: #64B493\"><\u002Fspan>\n                  <span style=\"font-size: 16px; font-weight: 600; letter-spacing: -0.01em\">Health<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size: 14px; color: #757C8A\">Three sessions<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height: 2px; border-radius: 999px; background: #F1F0EE; overflow: hidden\">\n                <div style=\"width: 66%; height: 100%; background: #64B493\"><\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"margin: 0; font-size: 14px; color: #757C8A\">Three tasks on the list. Two sessions attended.<\u002Fp>\n              <p style=\"margin: 0; padding-left: 10px; border-left: 1px solid #E8E6E3; font-size: 13px; line-height: 1.45; color: #757C8A; text-wrap: pretty\">Book the blood test, postponed three times. Comes back today at 14:00.<\u002Fp>\n            <\u002Fdiv>\n\n            <div style=\"background: #FDFDFC; border: 1px solid #E8E6E3; border-radius: 12px; box-shadow: 0 1px 2px rgba(33,38,48,0.04); padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n              <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px\">\n                <div style=\"display: flex; align-items: center; gap: 8px\">\n                  <span style=\"width: 8px; height: 8px; border-radius: 999px; background: #FCD581\"><\u002Fspan>\n                  <span style=\"font-size: 16px; font-weight: 600; letter-spacing: -0.01em\">Morning pages<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size: 14px; color: #757C8A\">Three sessions<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height: 2px; border-radius: 999px; background: #F1F0EE; overflow: hidden\">\n                <div style=\"width: 66%; height: 100%; background: #FCD581\"><\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"margin: 0; font-size: 14px; color: #757C8A\">Two sessions attended. Friday is open.<\u002Fp>\n              <p style=\"margin: 0; padding-left: 10px; border-left: 1px solid #E8E6E3; font-size: 13px; line-height: 1.45; color: #757C8A; text-wrap: pretty\">Write before you open anything else, postponed once on Wednesday.<\u002Fp>\n            <\u002Fdiv>\n\n            <div style=\"background: #FDFDFC; border: 1px solid #E8E6E3; border-radius: 12px; box-shadow: 0 1px 2px rgba(33,38,48,0.04); padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n              <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px\">\n                <div style=\"display: flex; align-items: center; gap: 8px\">\n                  <span style=\"width: 8px; height: 8px; border-radius: 999px; background: #86DEB7\"><\u002Fspan>\n                  <span style=\"font-size: 16px; font-weight: 600; letter-spacing: -0.01em\">People<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size: 14px; color: #757C8A\">One session<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height: 2px; border-radius: 999px; background: #F1F0EE; overflow: hidden\">\n                <div style=\"width: 0%; height: 100%; background: #86DEB7\"><\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"margin: 0; font-size: 14px; color: #757C8A\">One task on the list. No sessions yet.<\u002Fp>\n              <p style=\"margin: 0; padding-left: 10px; border-left: 1px solid #E8E6E3; font-size: 13px; line-height: 1.45; color: #757C8A; text-wrap: pretty\">Call my father back, postponed once. Waiting. It comes back when you next tend People.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding: 24px 20px; background: linear-gradient(to top, #F9F9F6 60%, rgba(249,249,246,0))\">\n          <button type=\"button\" style=\"width: 100%; height: 44px; border: 1px solid #E8E6E3; border-radius: 8px; background: transparent; color: #212630; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms\" style-hover=\"background: #F1F0EE\">Change the rhythm<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <div style=\"display: flex; flex-direction: column; gap: 10px; max-width: 720px; padding-top: 4px\">\n    <p style=\"margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Decisions the brief left open<\u002Fp>\n    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #757C8A; text-wrap: pretty\">A reminder belongs to the <strong style=\"color: #212630; font-weight: 500\">task<\u002Fstrong>, not a session. A session is fifteen minutes you choose to give an area; a reminder is a knock on a specific thing. The sheet says so in words, and separates the two: two mornings a week against a rhythm of three sessions.<\u002Fp>\n    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #757C8A; text-wrap: pretty\">On the reminder, <strong style=\"color: #212630; font-weight: 500\">Tend now and Not now are the same button twice<\u002Fstrong> — same size, same outline, side by side. Making one solid would be the app voting. Mark it done sits under them in ghost, worded as a sentence, so it cannot be hit by reflex.<\u002Fp>\n    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #757C8A; text-wrap: pretty\">At three or more postponements the screen adds <strong style=\"color: #212630; font-weight: 500\">one observation drawn from what you wrote<\u002Fstrong>, not a count or a warning: twice it was the phone call itself. It also offers taking the task off the week list, so the honest answer can be that this was never a fifteen-minute job.<\u002Fp>\n    <p style=\"margin: 0; font-size: 14px; line-height: 1.6; color: #757C8A; text-wrap: pretty\">Postponed tasks read back as an <strong style=\"color: #212630; font-weight: 500\">indented line under the area<\u002Fstrong>, in secondary grey with a hairline rule — the same device as a session note. It names the task, the count as plain words, and when it returns. Home shows the last reason; Week shows the next time.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"font-family: Geist, system-ui, sans-serif; color: #212630; padding: 28px 40px 72px; display: flex; flex-direction: column; gap: 28px\">\n  <div style=\"display: flex; flex-direction: column; gap: 8px\">\n    <p style=\"margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Tend · Round 1 · <a href=\"#1a\">1a<\u002Fa><\u002Fp>\n    <h1 style=\"margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em\">First run, Areas, Area, Home, Picker, Session, Capture, Inbox, Week, Review<\u002Fh1>\n    <p style=\"margin: 0; font-size: 14px; color: #757C8A; max-width: 560px; text-wrap: pretty\">Ten screens at 390px, plus the three states of the session clock. Areas, colors and rhythms are the user’s own — the names here are one person’s example.<\u002Fp>\n  <\u002Fdiv>\n\n  <div id=\"1a\" style=\"display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start\">\n\n    <!-- FIRST RUN -->\n    <div style=\"display: flex; flex-direction: column; gap: 10px\">\n      <div style=\"display: flex; align-items: baseline; gap: 10px\">\n        <span style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">First run<\u002Fspan>\n        <span style=\"font-size: 12px; color: rgba(117,124,138,0.6)\">Where do I start?<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"width: 390px; height: 844px; background: #F9F9F6; border: 1px solid #E8E6E3; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column\">\n        <div style=\"flex: 1; overflow: hidden; padding: 28px 20px 8px; display: flex; flex-direction: column; justify-content: center; gap: 24px\">\n          <div style=\"display: flex; flex-direction: column; gap: 10px\">\n            <p style=\"margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Tend<\u002Fp>\n            <h2 style=\"margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.15; text-wrap: pretty\">This is where your areas will live.<\u002Fh2>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 14px\">\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.5; color: #757C8A; text-wrap: pretty\">An area is a part of your life you come back to. Your health, your money, the hour you write in. It is never finished — you tend it.<\u002Fp>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.5; color: #757C8A; text-wrap: pretty\">Name one. Two or three is a whole practice; you can add more whenever.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 10px\">\n            <span style=\"width: 8px; height: 8px; border-radius: 999px; background: #ADEEE3\"><\u002Fspan>\n            <span style=\"width: 8px; height: 8px; border-radius: 999px; background: #64B493\"><\u002Fspan>\n            <span style=\"width: 8px; height: 8px; border-radius: 999px; background: #FCD581\"><\u002Fspan>\n            <span style=\"width: 8px; height: 8px; border-radius: 999px; background: #F5A65B\"><\u002Fspan>\n            <span style=\"font-size: 12px; color: rgba(117,124,138,0.5)\">Each area carries a color you choose.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 8px; background: linear-gradient(to top, #F9F9F6 60%, rgba(249,249,246,0))\">\n          <button type=\"button\" style=\"height: 44px; border: none; border-radius: 8px; background: #64B493; color: #FDFDFC; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms\" style-hover=\"background: #55A283\">Name your first area<\u002Fbutton>\n          <p style=\"margin: 0; text-align: center; font-size: 12px; color: rgba(117,124,138,0.5)\">Nothing is set up in advance, and nothing is suggested for you.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- AREAS -->\n    <div style=\"display: flex; flex-direction: column; gap: 10px\">\n      <div style=\"display: flex; align-items: baseline; gap: 10px\">\n        <span style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Areas<\u002Fspan>\n        <span style=\"font-size: 12px; color: rgba(117,124,138,0.6)\">What am I paying attention to?<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"width: 390px; height: 844px; background: #F9F9F6; border: 1px solid #E8E6E3; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column\">\n        <div style=\"flex: 1; overflow-y: auto; padding: 28px 20px 8px; display: flex; flex-direction: column; gap: 20px\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px\">\n            <p style=\"margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Your areas<\u002Fp>\n            <h2 style=\"margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em\">Five, in your order<\u002Fh2>\n          <\u002Fdiv>\n\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 10px\">\n\n            <div style=\"background: #FDFDFC; border: 1px solid #E8E6E3; border-radius: 12px; box-shadow: 0 1px 2px rgba(33,38,48,0.04); padding: 14px 8px 14px 16px; display: flex; align-items: center; gap: 10px\">\n              <div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px\">\n                <div style=\"display: flex; align-items: center; gap: 8px\">\n                  <span style=\"width: 8px; height: 8px; border-radius: 999px; background: #FCD581\"><\u002Fspan>\n                  <span style=\"font-size: 16px; font-weight: 600; letter-spacing: -0.01em\">Morning pages<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size: 14px; color: #757C8A\">Three sessions a week · in Home daily<\u002Fspan>\n              <\u002Fdiv>\n              <button type=\"button\" aria-label=\"Reorder Morning pages\" style=\"width: 44px; height: 44px; flex-shrink: 0; border: none; background: transparent; border-radius: 8px; cursor: grab; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; transition: background-color 150ms\" style-hover=\"background: #F1F0EE\">\n                <span style=\"width: 14px; height: 1px; background: #757C8A\"><\u002Fspan>\n                <span style=\"width: 14px; height: 1px; background: #757C8A\"><\u002Fspan>\n                <span style=\"width: 14px; height: 1px; background: #757C8A\"><\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"background: #FDFDFC; border: 1px solid #E8E6E3; border-radius: 12px; box-shadow: 0 1px 2px rgba(33,38,48,0.04); padding: 14px 8px 14px 16px; display: flex; align-items: center; gap: 10px\">\n              <div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px\">\n                <div style=\"display: flex; align-items: center; gap: 8px\">\n                  <span style=\"width: 8px; height: 8px; border-radius: 999px; background: #64B493\"><\u002Fspan>\n                  <span style=\"font-size: 16px; font-weight: 600; letter-spacing: -0.01em\">Health<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size: 14px; color: #757C8A\">Three sessions a week · in Home daily<\u002Fspan>\n              <\u002Fdiv>\n              <button type=\"button\" aria-label=\"Reorder Health\" style=\"width: 44px; height: 44px; flex-shrink: 0; border: none; background: transparent; border-radius: 8px; cursor: grab; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; transition: background-color 150ms\" style-hover=\"background: #F1F0EE\">\n                <span style=\"width: 14px; height: 1px; background: #757C8A\"><\u002Fspan>\n                <span style=\"width: 14px; height: 1px; background: #757C8A\"><\u002Fspan>\n                <span style=\"width: 14px; height: 1px; background: #757C8A\"><\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"background: #FDFDFC; border: 1px solid #E8E6E3; border-radius: 12px; box-shadow: 0 1px 2px rgba(33,38,48,0.04); padding: 14px 8px 14px 16px; display: flex; align-items: center; gap: 10px\">\n              <div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px\">\n                <div style=\"display: flex; align-items: center; gap: 8px\">\n                  <span style=\"width: 8px; height: 8px; border-radius: 999px; background: #ADEEE3\"><\u002Fspan>\n                  <span style=\"font-size: 16px; font-weight: 600; letter-spacing: -0.01em\">Home<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size: 14px; color: #757C8A\">Two sessions a week · in Home daily<\u002Fspan>\n              <\u002Fdiv>\n              <button type=\"button\" aria-label=\"Reorder Home\" style=\"width: 44px; height: 44px; flex-shrink: 0; border: none; background: transparent; border-radius: 8px; cursor: grab; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; transition: background-color 150ms\" style-hover=\"background: #F1F0EE\">\n                <span style=\"width: 14px; height: 1px; background: #757C8A\"><\u002Fspan>\n                <span style=\"width: 14px; height: 1px; background: #757C8A\"><\u002Fspan>\n                <span style=\"width: 14px; height: 1px; background: #757C8A\"><\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"background: #FDFDFC; border: 1px solid #E8E6E3; border-radius: 12px; box-shadow: 0 1px 2px rgba(33,38,48,0.04); padding: 14px 8px 14px 16px; display: flex; align-items: center; gap: 10px\">\n              <div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px\">\n                <div style=\"display: flex; align-items: center; gap: 8px\">\n                  <span style=\"width: 8px; height: 8px; border-radius: 999px; background: #86DEB7\"><\u002Fspan>\n                  <span style=\"font-size: 16px; font-weight: 600; letter-spacing: -0.01em\">People<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size: 14px; color: #757C8A\">One session a week · not in Home daily<\u002Fspan>\n              <\u002Fdiv>\n              <button type=\"button\" aria-label=\"Reorder People\" style=\"width: 44px; height: 44px; flex-shrink: 0; border: none; background: transparent; border-radius: 8px; cursor: grab; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; transition: background-color 150ms\" style-hover=\"background: #F1F0EE\">\n                <span style=\"width: 14px; height: 1px; background: #757C8A\"><\u002Fspan>\n                <span style=\"width: 14px; height: 1px; background: #757C8A\"><\u002Fspan>\n                <span style=\"width: 14px; height: 1px; background: #757C8A\"><\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"background: #FDFDFC; border: 1px solid #212630; border-radius: 12px; box-shadow: 0 1px 2px rgba(33,38,48,0.04); padding: 16px; display: flex; flex-direction: column; gap: 14px\">\n              <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                <div style=\"display: flex; align-items: center; gap: 8px\">\n                  <span style=\"width: 8px; height: 8px; border-radius: 999px; background: #F5A65B\"><\u002Fspan>\n                  <span style=\"font-size: 16px; font-weight: 600; letter-spacing: -0.01em\">Money<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size: 14px; color: #757C8A\">Two sessions a week · in Home daily<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin: 0; font-size: 14px; line-height: 1.5; color: #757C8A; text-wrap: pretty\">Removing Money keeps its five tasks. They move to the inbox carrying the name, and its eleven past sessions stay in Review.<\u002Fp>\n              <div style=\"display: flex; gap: 8px\">\n                <button type=\"button\" style=\"flex: 1; height: 44px; border: 1px solid #E8E6E3; border-radius: 8px; background: transparent; color: #212630; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms\" style-hover=\"background: #F1F0EE\">Remove the area<\u002Fbutton>\n                <button type=\"button\" style=\"flex: 1; height: 44px; border: none; border-radius: 8px; background: transparent; color: #757C8A; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms, color 150ms\" style-hover=\"background: #F1F0EE; color: #212630\">Keep it<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n          <\u002Fdiv>\n\n          <p style=\"margin: 0; font-size: 12px; color: rgba(117,124,138,0.5); text-wrap: pretty\">Drag to reorder. Home shows them in this order. Tap an area to change its name, color or rhythm.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"padding: 24px 20px; background: linear-gradient(to top, #F9F9F6 60%, rgba(249,249,246,0))\">\n          <button type=\"button\" style=\"width: 100%; height: 44px; border: 1px solid #E8E6E3; border-radius: 8px; background: transparent; color: #212630; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms\" style-hover=\"background: #F1F0EE\">New area<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- AREA · EDIT -->\n    <div style=\"display: flex; flex-direction: column; gap: 10px\">\n ay: flex; gap: 8px\">\n              <button type=\"button\" sc-camel-on-click=\"{{ pickDaily }}\" data-daily=\"1\" style=\"flex: 1; height: 44px; border: 1px solid #212630; border-color: {{ dBorder1 }}; border-radius: 8px; background: #212630; color: #F9F9F6; background: {{ dBg1 }}; color: {{ dFg1 }}; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms, border-color 150ms, color 150ms\">Every day<\u002Fbutton>\n              <button type=\"button\" sc-camel-on-click=\"{{ pickDaily }}\" data-daily=\"0\" style=\"flex: 1; height: 44px; border: 1px solid #E8E6E3; border-color: {{ dBorder0 }}; border-radius: 8px; background: #FDFDFC; color: #212630; background: {{ dBg0 }}; color: {{ dFg0 }}; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms, border-color 150ms, color 150ms\">When I add it<\u002Fbutton>\n            <\u002Fdiv>\n            <p style=\"margin: 0; font-size: 12px; color: rgba(117,124,138,0.5); text-wrap: pretty\">Either way it stays on the week list. This only decides whether it waits for you on Home.<\u002Fp>\n          <\u002Fdiv>\n\n          <p style=\"margin: 0; padding-bottom: 20px; font-size: 12px; color: rgba(117,124,138,0.5); text-wrap: pretty\">Changes apply as you make them. Done takes you back to your areas.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- HOME -->\n    <div style=\"display: flex; flex-direction: column; gap: 10px\">\n      <div style=\"display: flex; align-items: baseline; gap: 10px\">\n        <span style=\"font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Home<\u002Fspan>\n        <span style=\"font-size: 12px; color: rgba(117,124,138,0.6)\">What am I tending right now?<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"width: 390px; height: 844px; background: #F9F9F6; border: 1px solid #E8E6E3; border-radius: 20px; overflow: hidden; ight: 500; cursor: pointer; transition: background-color 150ms\" style-hover=\"background: #55A283\">Tend<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"background: #FDFDFC; border: 1px solid #E8E6E3; border-radius: 12px; box-shadow: 0 1px 2px rgba(33,38,48,0.04); padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n              <div style=\"display: flex; flex-direction: column; gap: 6px\">\n                <div style=\"display: flex; align-items: center; gap: 8px\">\n                  <span style=\"width: 8px; height: 8px; border-radius: 999px; background: #FCD581\"><\u002Fspan>\n                  <span style=\"font-size: 16px; font-weight: 600; letter-spacing: -0.01em\">Morning pages<\u002Fspan>\n                <\u002Fdiv>\n                <p style=\"margin: 0; font-size: 14px; color: #757C8A\">Last attended Thursday.<\u002Fp>\n              <\u002Fdiv>\n              <button type=\"button\" style=\"height: 44px; border: none; border-radius: 8px; background: #64B493; color: #FDFDFC; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms\" style-hover=\"background: #55A283\">Tend<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"background: #FDFDFC; border: 1px solid #E8E6E3; border-radius: 12px; box-shadow: 0 1px 2px rgba(33,38,48,0.04); padding: 20px; display: flex; flex-direction: column; gap: 14px\">\n              <div style=\"display: flex; flex-direction: column; gap: 6px\">\n                <div style=\"display: flex; align-items: center; gap: 8px\">\n                  <span style=\"width: 8px; height: 8px; border-radius: 999px; background: #F5A65B\"><\u002Fspan>\n                  <span style=\"font-size: 16px; font-weight: 600; letter-spacing: -0.01em\">Money<\u002Fspan>\n                <\u002Fdiv>\n                <p style=\"margin: 0; font-size: 14px; color: #757C8A; text-wrap: pretty\">Past the two sessions you set for this week. Tend it anyway -between\">\n                <div style=\"display: flex; align-items: center; gap: 8px\">\n                  <span style=\"width: 8px; height: 8px; border-radius: 999px; background: #F5A65B\"><\u002Fspan>\n                  <span style=\"font-size: 16px; font-weight: 600; letter-spacing: -0.01em\">Money<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size: 14px; color: #757C8A\">Two sessions<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin: 0; font-size: 14px; color: #757C8A; text-wrap: pretty\">31 minutes. Last note: statements sorted through August.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background: #FDFDFC; border: 1px solid #E8E6E3; border-radius: 12px; box-shadow: 0 1px 2px rgba(33,38,48,0.04); padding: 18px 20px; display: flex; align-items: center; justify-content: space-between\">\n              <div style=\"display: flex; align-items: center; gap: 8px\">\n                <span style=\"width: 8px; height: 8px; border-radius: 999px; background: #ADEEE3\"><\u002Fspan>\n                <span style=\"font-size: 16px; font-weight: 600; letter-spacing: -0.01em\">Home<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"font-size: 14px; color: #757C8A\">One session, 15 minutes<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display: flex; flex-direction: column; gap: 12px\">\n            <p style=\"margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.16em; color: rgba(117,124,138,0.45)\">Unattended<\u002Fp>\n            <div style=\"background: #FDFDFC; border: 1px solid #E8E6E3; border-radius: 12px; box-shadow: 0 1px 2px rgba(33,38,48,0.04); padding: 18px 20px; opacity: 0.55; display: flex; flex-direction: column; gap: 6px\">\n              <div style=\"display: flex; align-items: center; gap: 8px\">\n                <span style=\"width: 8px; height: 8px; border-radius: 999px; background: #FCD581\"><\u002Fspan>\n                <span style=\"font-size: 16px; font-weight: 600; letter-spacing: -0.01em\">Morning pages<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin: 0; font-size: 14px; color: #757C8A\">No sessions this week. The pages are where you left them.<\u002Fp>\n            <\u002Fdiv>\n            <p style=\"margin: 0; font-size: 12px; color: rgba(117,124,138,0.5); text-wrap: pretty\">Unattended is a fact about the week, not about you. Next week starts with the same areas.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding: 24px 20px; background: linear-gradient(to top, #F9F9F6 60%, rgba(249,249,246,0))\">\n          <button type=\"button\" style=\"width: 100%; height: 44px; border: none; border-radius: 8px; background: #64B493; color: #FDFDFC; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; transition: background-color 150ms\" style-hover=\"background: #55A283\">Set this week's rhythm<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;sessionStartSeconds&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:900,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:30,&quot;max&quot;:1800,&quot;step&quot;:30,&quot;unit&quot;:&quot;s&quot;,&quot;section&quot;:&quot;Session&quot;},&quot;timerRunning&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Session&quot;}}\">\nclass Component extends DCLogic {\n  state = { selected: 0, area: null };\n  clockRef = React.createRef();\n  noteRef = React.createRef();\n\n  componentDidMount() {\n    this.elapsed = 44;\n    this.paint();\n    if (this.props.timerRunning === false) return;\n    this._t = setInterval(() => { this.elapsed += 1; this.paint(); }, 1000);\n  }\n  componentDidUpdate() { this.paint(); }\n  componentWillUnmount() { clearInterval(this._t); }\n\n  paint() {\n    const left = (this.props.sessionStartSeconds ?? 900) - (this.elapsed || 0);\n    const m = Math.floor(Math.abs(left) / 60), s = Math.abs(left) % 60;\n    const t = m + \":\" + String(s).padStart(2, \"0\");\n    if (this.clockRef.current) this.clockRef.current.textContent = left >= 0 ? t : \"+\" + t;\n    if (this.noteRef.current) this.noteRef.current.textContent = left >= 0\n      ? \"Fifteen minutes on Health.\"\n      : \"Fifteen minutes passed. The session keeps recording.\";\n  }\n\n  renderVals() {\n    const bc = i => (i === this.state.selected ? \"#212630\" : \"#E8E6E3\");\n    const color = this.state.color ?? 4;\n    const rhythm = this.state.rhythm ?? 3;\n    const daily = this.state.daily ?? 1;\n    const edit = {};\n    [0, 1, 2, 3, 4].forEach(i => { edit[\"swatch\" + i] = i === color ? \"#212630\" : \"#E8E6E3\"; });\n    [1, 2, 3, 4, 5].forEach(n => {\n      const sel = n === rhythm;\n      edit[\"rBorder\" + n] = sel ? \"#212630\" : \"#E8E6E3\";\n      edit[\"rBg\" + n] = sel ? \"#212630\" : \"#FDFDFC\";\n      edit[\"rFg\" + n] = sel ? \"#F9F9F6\" : \"#212630\";\n    });\n    [0, 1].forEach(d => {\n      const sel = d === daily;\n      edit[\"dBorder\" + d] = sel ? \"#212630\" : \"#E8E6E3\";\n      edit[\"dBg\" + d] = sel ? \"#212630\" : \"#FDFDFC\";\n      edit[\"dFg\" + d] = sel ? \"#F9F9F6\" : \"#212630\";\n    });\n    const on = i => i === this.state.area;\n    const chip = {};\n    [0, 1, 2, 3].forEach(i => {\n      chip[\"chipBorder\" + i] = on(i) ? \"#212630\" : \"#E8E6E3\";\n      chip[\"chipBg\" + i] = on(i) ? \"#212630\" : \"#FDFDFC\";\n      chip[\"chipFg\" + i] = on(i) ? \"#F9F9F6\" : \"#212630\";\n    });\n    return {\n      ...chip,\n      ...edit,\n      pickColor: e => this.setState({ color: Number(e.currentTarget.dataset.color) }),\n      pickRhythm: e => this.setState({ rhythm: Number(e.currentTarget.dataset.n) }),\n      pickDaily: e => this.setState({ daily: Number(e.currentTarget.dataset.daily) }),\n      pickArea: e => {\n        const i = Number(e.currentTarget.dataset.area);\n        this.setState(s => ({ area: s.area === i ? null : i }));\n      },\n      border0: bc(0), border1: bc(1), border2: bc(2),\n      selectTask: e => this.setState({ selected: Number(e.currentTarget.dataset.index) }),\n      clockRef: this.clockRef,\n      noteRef: this.noteRef\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
